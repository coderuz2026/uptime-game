<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>АПТАЙМ: День первый</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:#0b0f17;color:#e6edf3;font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{margin:0 auto;display:flex;flex-direction:column;height:100%}
#hud{padding:6px 5px 5px;position:relative;z-index:8}
.row{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:linear-gradient(#232b38,#161c26);border:1px solid #3a4558;border-radius:12px;padding:7px 9px;font-size:13px;font-weight:800;box-shadow:inset 0 1px 0 #ffffff14,0 2px 6px #0008;white-space:nowrap;color:#fff;font-family:inherit}
#clock{color:#7ee787;font-family:Inter,system-ui,sans-serif;font-size:10px}
#goal{flex:1;min-width:0;cursor:pointer}
#goal span{overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:#ffd166}
#stage{position:relative;margin:0 auto;flex:1;width:100%;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#1a2436,#0b0f17 75%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.mk{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;will-change:transform}
.mk .ic{pointer-events:auto;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;margin-top:-44px;box-shadow:0 3px 10px #000a;border:2px solid #fff;position:relative}
.mk .ic:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.mk .ic.q{background:linear-gradient(#ffd166,#f0a000);color:#3a2500;animation:bob 1s ease-in-out infinite alternate}
.mk .ic.t{background:linear-gradient(#79c0ff,#1f6feb);color:#fff;animation:bob 1s ease-in-out infinite alternate}
.mk .ic.c{background:#f6f8fa;color:#333;width:28px;height:28px;font-size:13px;opacity:.85;margin-top:-38px}
.mk .ic.d{background:linear-gradient(#2ea043,#1a7f37);color:#fff;width:32px;height:32px;font-size:15px;margin-top:-40px}
#locname{position:absolute;left:8px;bottom:8px;z-index:4;font-size:11px;font-weight:800;background:#0d1117cc;border:1px solid #30363d;padding:4px 9px;border-radius:9px;pointer-events:none;color:#c9d1d9}
input[type=range]{accent-color:#2ea043}
.mk .ic.s{background:linear-gradient(#a371f7,#6e40c9);color:#fff;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -5px}}
.mk .nm{margin-top:6px;font-size:10px;font-weight:800;background:#0d1117cc;padding:1px 6px;border-radius:6px;white-space:nowrap;color:#c9d1d9}
.chat{position:absolute;left:0;top:0;background:#fff;color:#1b1d29;font:700 11px/1.25 Inter,system-ui,sans-serif;padding:5px 8px;border-radius:11px;pointer-events:none;box-shadow:0 2px 8px #0007;animation:cin .2s;max-width:150px;width:max-content;text-align:center}
@keyframes cin{from{scale:.5;opacity:0}}
#toasts{position:absolute;top:8px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:7}
.toast{background:#0d1117ee;border:1px solid #3a4558;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 6px 20px #000a;animation:tin .3s cubic-bezier(.2,1.4,.5,1),tout .4s 2.8s forwards;max-width:92%}
.toast.g{border-color:#2ea043;color:#7ee787}.toast.r{border-color:#da3633;color:#ff7b72}.toast.y{border-color:#d29922;color:#ffd166}.toast.b{border-color:#1f6feb;color:#79c0ff}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.hidden{display:none!important}
/* dialogue */
#dlg{position:absolute;left:0;right:0;bottom:0;padding:8px;z-index:5;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(20px)}}
.dbox{max-width:520px;margin:0 auto;background:linear-gradient(#1b2230f5,#10151df5);backdrop-filter:blur(10px);border:1px solid #3a4558;border-radius:18px;padding:12px 12px 10px;box-shadow:0 -6px 30px #000c,inset 0 1px 0 #ffffff14}
.dhead{display:flex;gap:11px;align-items:center;margin-bottom:8px}
.por{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;border:2px solid #3a4558;box-shadow:0 4px 12px #0008;animation:pin .25s cubic-bezier(.2,1.5,.5,1)}
@keyframes pin{from{scale:.6}}
.por svg{width:100%;height:100%;display:block}
.dname{font-size:16px;font-weight:900}.drole{font-size:11px;color:#8b949e;font-weight:700}
.dtext{font-size:15.5px;line-height:1.45;font-weight:600;min-height:44px;color:#f0f6fc}
.dtext.narr{font-style:italic;color:#c9d1d9}
.dnext{text-align:right;font-size:11px;color:#6e7681;margin-top:4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chs{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.ch{text-align:left;background:linear-gradient(#21293a,#192030);border:1px solid #3a4558;color:#f0f6fc;border-radius:12px;padding:11px 12px;font-size:14px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:8px;animation:fi .25s backwards}
.ch:active{background:#2d3a52;transform:scale(.98)}
.ch b{color:#79c0ff;font-size:12px}
.ch .tg{margin-left:auto;font-size:11px;color:#8b949e;white-space:nowrap}
/* minigames */
#mg{position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(3,6,10,.82));display:flex;align-items:flex-end;justify-content:center;padding:8px;z-index:6;animation:fi .15s}
.mgbox{width:100%;max-width:500px;background:linear-gradient(#1c2330f5,#121820f5);backdrop-filter:blur(8px);border:1px solid #3a4558;border-radius:16px;padding:12px;box-shadow:0 -4px 30px #000c,inset 0 1px 0 #ffffff12}
.mghead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mghead .ic{font-size:24px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#0d1117;border:1px solid #30363d;border-radius:12px}
.mghead b{display:block;font-size:11px;color:#79c0ff;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.mghead span{font-size:15px;font-weight:900}
.hint{font-size:13px;color:#9aa7b4;margin-bottom:10px;line-height:1.4;font-weight:600}
.plug{position:relative;margin:0 auto 12px;width:max-content;padding:16px 10px 8px;background:linear-gradient(#eaf2fbcc,#b9c8d8aa);border:2px solid #d8e3ee;border-radius:6px 6px 16px 16px;box-shadow:inset 0 2px 6px #fff8,0 4px 10px #0008}
.plug:before{content:'';position:absolute;top:4px;left:10px;right:10px;height:6px;background:repeating-linear-gradient(90deg,#e3b341 0 14px,transparent 14px 22px)}
.slots{display:flex;gap:4px}
.slot{width:18px;height:52px;border-radius:9px 9px 3px 3px;background:#00000018;border:1px dashed #6e768188}
.wires{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.wire{width:32px;height:70px;border-radius:16px 16px 6px 6px;border:none;box-shadow:0 3px 0 #0008}
.wire:active{transform:scale(.92)}.wire:disabled{opacity:.12}
.cheat{display:flex;gap:3px;justify-content:center;margin:6px 0}.cheat i{width:12px;height:22px;border-radius:6px 6px 2px 2px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(#2ea043,#1f7a33);color:#fff;font-size:15px;font-weight:900;box-shadow:0 5px 0 #0f4a1e,inset 0 1px 0 #ffffff44}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0f4a1e}
.btn.red{background:linear-gradient(#f85149,#b62324);box-shadow:0 5px 0 #6e1111,inset 0 1px 0 #ffffff44}
.btn.blue{background:linear-gradient(#388bfd,#1f5fc9);box-shadow:0 5px 0 #0d3277,inset 0 1px 0 #ffffff44}
.small{background:#0d1117;border:1px solid #30363d;color:#9aa7b4;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700}
.foot{display:flex;justify-content:space-between;margin-top:10px}
.tbar{position:relative;height:36px;background:#05080c;border:1px solid #30363d;border-radius:10px;margin-bottom:10px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:linear-gradient(#56d36455,#2ea04388);border-left:2px solid #7ee787;border-right:2px solid #7ee787}
.mark{position:absolute;top:-2px;bottom:-2px;width:5px;background:#fff;box-shadow:0 0 10px #ffd166;border-radius:3px}
.hits{text-align:center;font-size:16px;margin-bottom:10px;letter-spacing:5px;font-weight:800}
.prog{height:16px;background:#05080c;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(#79c0ff,#1f6feb)}
.mail{background:#fff;color:#1b1d29;border-radius:12px;padding:12px;font-size:13.5px;line-height:1.5;margin-bottom:10px}
.mail .hd{border-bottom:1px solid #d0d7de;padding-bottom:6px;margin-bottom:8px}
.ms{border-radius:5px;padding:1px 3px;cursor:pointer;transition:background .15s}
.ms:active{background:#ffd16655}
.ms.found{background:#ffd5d2;outline:2px solid #f85149;color:#a40e26}
.ms.wrong{background:#d0d7de;text-decoration:line-through;color:#8b949e}
.att{display:inline-block;margin-top:8px;background:#f6f8fa;border:1px solid #d0d7de;padding:6px 10px;border-radius:8px;font-weight:700}
.tm{background:#f6f8fa;color:#1b1d29;border-radius:12px;overflow:hidden;margin-bottom:10px;font-size:13px}
.tm .th{display:flex;background:#e6eaef;font-weight:800;padding:7px 10px;font-size:11px;color:#57606a}
.tm .tr{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid #e1e4e8;cursor:pointer}
.tm .tr:active{background:#ddf4ff}
.tm .tr.bad{background:#ffebe9}
.tm .cpu{margin-left:auto;width:70px;height:8px;background:#e1e4e8;border-radius:4px;overflow:hidden}
.tm .cpu i{display:block;height:100%;background:#2da44e}
.tm .pc{width:38px;text-align:right;font-weight:800;font-size:12px}
.shake{animation:sh .3s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* journal */
#jr{position:absolute;inset:0;background:rgba(3,6,10,.7);z-index:7;display:flex;align-items:center;justify-content:center;padding:12px;animation:fi .2s}
.jbox{width:100%;max-width:500px;max-height:100%;overflow:auto;background:linear-gradient(#1c2330,#121820);border:1px solid #3a4558;border-radius:18px;padding:14px}
.jbox h3{margin:14px 0 8px;font-size:12px;letter-spacing:2px;color:#79c0ff;text-transform:uppercase}
.jbox h3:first-child{margin-top:0}
.ob{display:flex;gap:8px;padding:7px 0;font-weight:700;font-size:14px;border-bottom:1px solid #222a36}
.ob.done{color:#6e7681;text-decoration:line-through}
.ppl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp{display:flex;align-items:center;gap:8px;background:#0d1117;border:1px solid #30363d;border-radius:12px;padding:6px}
.pp .por{width:40px;height:40px;border-radius:10px;border-width:1px;animation:none}
.pp b{font-size:12px;display:block}.pp small{font-size:12px}
.clue{display:flex;gap:8px;padding:7px 10px;background:#0d1117;border:1px solid #30363d;border-radius:10px;margin-bottom:6px;font-size:13px;font-weight:600}
#screen{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(8,12,20,.4),rgba(4,6,10,.93));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px;z-index:9;overflow:auto}
#screen h1{font-family:Inter,system-ui,sans-serif;font-size:28px;margin:0;color:#7ee787;text-shadow:0 0 18px #2ea043,3px 3px 0 #0b3d17;letter-spacing:2px}
#screen h2{font-size:18px;margin:0;color:#ffd166;font-weight:900}
#screen p{font-size:14px;color:#c9d1d9;margin:0;line-height:1.55;font-weight:600}
#screen .btn{max-width:280px}
.tag{font-family:Inter,system-ui,sans-serif;font-size:8px;color:#79c0ff;letter-spacing:2px}
.sum{width:100%;max-width:420px;text-align:left;background:#0d1117dd;border:1px solid #30363d;border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.7;font-weight:700}
#load{position:absolute;inset:0;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;font-size:10px;color:#79c0ff;z-index:10;background:#0b0f17}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .6s;z-index:8}


#hub{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#070a10;max-width:560px;margin:0 auto;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#e8edf4;-webkit-font-smoothing:antialiased}
#hub.hidden{display:none}
.ico{display:inline-flex;width:1.05em;height:1.05em;vertical-align:-.16em;margin-right:.35em;flex:none}.ico svg{width:100%;height:100%}
.htop{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;background:linear-gradient(180deg,rgba(10,14,22,.96),rgba(10,14,22,.82));backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06);z-index:3}
.ava{position:relative;width:44px;height:44px;flex:none;cursor:pointer}
.ava svg{position:absolute;inset:0}
.ava .face{position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:#1a2a22}
.ava .lv{position:absolute;bottom:-3px;right:-5px;background:linear-gradient(135deg,#5eead4,#3b82f6);color:#04121a;font-weight:800;font-size:10.5px;border-radius:8px;padding:1px 5px;border:2px solid #0a0e16}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:6px 10px 6px 7px;font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:transform .15s}
.pill svg{width:20px;height:20px;flex:none}
.pill.m{flex:1}.pill.g{cursor:pointer}
.pill .plus{display:grid;place-items:center;width:18px;height:18px;border-radius:6px;background:#22c55e;color:#03140a;margin-left:2px}.pill .plus svg{width:12px;height:12px}
.pill.bst{color:#fbbf24;font-size:12.5px}
.gear{display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;width:38px;height:38px;color:#cbd5e1;flex:none;padding:0}.gear svg{width:19px;height:19px}
.hbody{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 60% at 50% 0%,#0f1726,#070a10)}
.hbody.tw{overflow:hidden}
.hnav{display:flex;background:rgba(10,14,22,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.06);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.hnav button{flex:1;background:none;border:none;color:#6b7686;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;position:relative;font-family:inherit;transition:color .15s}
.hnav button svg{width:22px;height:22px}
.hnav button.on{color:#e8edf4}.hnav button.on:before{content:'';position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:linear-gradient(90deg,#5eead4,#3b82f6)}
.hnav .dot{position:absolute;top:1px;right:22%;background:#ef4444;color:#fff;font-size:9.5px;font-style:normal;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;border:2px solid #0a0e16}.hnav .dot.b{background:#3b82f6}
.boot{display:grid;place-items:center;align-content:center;gap:14px;height:100%;color:#94a3b8;font-weight:600;font-size:13px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #ffffff18;border-top-color:#5eead4;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* tower */
.tower{position:absolute;inset:0;overflow:hidden}
.tower canvas{display:block}
.tchips{position:absolute;inset:0;pointer-events:none}
.tchip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;pointer-events:auto;will-change:transform}
.tc-l{display:flex;align-items:center;gap:8px;background:rgba(10,14,22,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 10px 6px 6px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;max-width:200px}
.tc-l b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.tc-l small{display:block;font-size:11px;color:#94a3b8;font-weight:600;font-variant-numeric:tabular-nums}
.tc-l>.ico{width:26px;height:26px;margin:0;padding:5px;border-radius:9px;background:rgba(255,255,255,.08);color:#5eead4}
.tchip.lk .tc-l{opacity:.75}.tchip.lk .tc-l>.ico{color:#94a3b8}
.tc-al{display:none;width:26px;height:26px;border-radius:9px;background:#ef4444;color:#fff;align-items:center;justify-content:center;animation:pl .6s infinite alternate}.tc-al .ico{margin:0;width:15px;height:15px}
.tchip.bad .tc-al{display:flex}.tchip.bad .tc-l{border-color:rgba(239,68,68,.6)}
@keyframes pl{to{transform:scale(1.12)}}
.collect{display:flex;align-items:center;gap:5px;border:none;border-radius:12px;padding:7px 11px 7px 7px;font:700 13px Inter,system-ui,sans-serif;color:#0a1a10;background:linear-gradient(180deg,#e2e8f0,#cbd5e1);box-shadow:0 4px 12px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.collect svg{width:18px;height:18px}
.collect.full{background:linear-gradient(180deg,#fde68a,#f5b82e);animation:pl .7s infinite alternate}
.mono{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.mono.xl{width:56px;height:56px;border-radius:16px;font-size:18px}
/* panels */
.pnl{padding:14px 12px 24px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px;font-size:12px;letter-spacing:.8px;color:#8b98ab;text-transform:uppercase;font-weight:700}
.sec:first-child{margin-top:4px}.sec em{font-style:normal;color:#cbd5e1;letter-spacing:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px;margin-bottom:8px}
.card.eq{display:flex;align-items:center;gap:11px}
.card.empty{color:#7a8798;font-size:13px;font-weight:500;text-align:center;padding:16px}
.ic2{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:rgba(94,234,212,.08);color:#5eead4;border:1px solid rgba(94,234,212,.15);flex:none}
.ic2 svg{width:22px;height:22px}.ic2.gold{color:#fbbf24;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.18)}.ic2.blue{color:#60a5fa;background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.18)}.ic2.green{color:#4ade80;background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.18)}.ic2.ok{color:#4ade80}
.ava2{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#334155,#1e293b);font-weight:800;color:#cbd5e1;flex:none}
.tx{flex:1;min-width:0}
.tx b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.tx b em{font-style:normal;font-size:11px;color:#94a3b8;font-weight:600;background:rgba(255,255,255,.06);border-radius:6px;padding:1px 6px}
.tx small{display:block;font-size:12px;color:#8b98ab;font-weight:500;margin-top:3px;line-height:1.35}
.pips{display:flex;gap:3px;margin-top:7px}.pips i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08)}.pips i.on{background:linear-gradient(90deg,#5eead4,#3b82f6)}

function ep1NodeFor(id){const f=F();
  if(id==='nigora'){if(!f.met_nigora)return 'nig1';if(f.met_boss&&!f.knowR)return 'nigR';return null}
  if(['bobur','jasur','kamila','hamid','rustam'].includes(id)){
    if(id==='rustam'){if(!f.metR)return 'rus1';if(has('flash_data')&&!f.ev.rusF)return 'rusF';if(f.res2==='boss'||f.res2==='private')return 'rusEnd';return null}
    if(id==='bobur'){if(!f.bobTV)return 'bob1';if(f.metR&&!has('bobur_saw'))return 'bobQ';return null}
    if(id==='kamila')return !f.kam?'kam1':null;
    if(id==='jasur')return (has('laptop_found')&&!has('jasur_slip'))||!f.ev.jas?(f.ev.jas=1,'jas1'):null;
    if(id==='hamid')return !f.ham?'ham1':null}
  if(!f.met_nigora&&id!=='gulya')return {who:id,mood:'n',text:'Ой, вы новенький? Отметьтесь сначала на ресепшене у Нигоры.',next:END};
  if(id==='boss'){if(!f.met_boss)return 'boss1';if(f.ransom===1&&!f.ev.bossV)return 'bossVirus';if(ready())return 'bossReady';return null}
  if(!f.met_boss&&id!=='gulya')return {who:id,mood:'n',text:'Сначала зайди к директору, он тебя уже ждёт.',next:END};
  if(id==='dilnoza'){if(f.dil===0)return 'dil1';if(f.dil===1)return 'dilW';if(f.dil===2)return 'dilF';return null}
  if(id==='sardor'){if(f.dil===1)return 'sar1';if(evS()>=1&&!f.res2)return 'sarC';return null}
  if(id==='lola'){if(f.lola===0)return 'lola1';if(f.ransom===1)return 'lolaW';return null}
  if(id==='timur'){if(f.virus===1)return 'timV';if(evT()>=1&&!f.res)return 'timC';if(!f.tim)return 'tim1';return null}
  if(id==='malika'){if(f.mal===0)return 'mal1';if(f.mal===1)return {who:'malika',mood:'s',text:'Принтер, умоляю! Он в углу слева 🙏',next:END};return null}
  if(id==='gulya'){if(f.srv>=1&&!f.gul)return 'gul1';if(f.gul==='ok'&&f.metR&&!has('scissors'))return 'gul4';return null}
  return null}

  if(!$('jr').classList.contains('hidden')){const c=$('jclose');if(c)c.click();return true}
  if(!$('pc').classList.contains('hidden')){closePC();return true}
  if(!$('pause').classList.contains('hidden')){closePause();return true}
  if(G&&G.running){if(!$('dlg').classList.contains('hidden'))return true;openPause();return true}
  if(SCR==='season'||SCR==='about'){showMainMenu();return true}
  if(SCR==='ending'){showSeason();return true}
  return false};
try{history.pushState({u:1},'');addEventListener('popstate',()=>{if(window.uptimeBack())history.pushState({u:1},'')})}catch(e){}
function splash(){const lines=['> ping turan.uz','64 bytes: time=12 ms','> systemctl start uptime','[ OK ] Сеть поднята','> uptime','99.9% ✓'];const t=$('spterm'),bar=$('spbar');let i=0;
  const step=()=>{if(i<lines.length){t.innerHTML+=`<div>${lines[i]}</div>`;i++;bar.style.width=(i/lines.length*100)+'%';beep(400+i*60,.03,'square',.015);setTimeout(step,260)}else setTimeout(done,350)};
  const done=()=>{const sp=$('splash');sp.classList.add('out');setTimeout(()=>sp.remove(),650);showMainMenu()};
  setTimeout(()=>{render3DPortraits();step()},120)}
fetch('version.json').then(r=>r.json()).then(v=>{window.UPTIME_V=v.web;const e=document.querySelector('.mver');if(e)e.textContent='версия '+v.web}).catch(()=>{});
applyQ(false);splash();
